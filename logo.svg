<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Primary Shield Gradient -->
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Core Security Flame / Barrier Gradient -->
    <linearGradient id="firewallGrad" x1="44" y1="36" x2="84" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Outer Glow & Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Shield Contour -->
  <path d="M64 12 L106 28 C106 72 78 104 64 116 C50 104 22 72 22 28 Z"
        fill="url(#shieldGrad)"
        fill-opacity="0.12"
        stroke="url(#borderGrad)"
        stroke-width="3.5"
        stroke-linejoin="round" />

  <!-- Inner Solid Armor Shield -->
  <path d="M64 20 L98 34 C98 70 74 97 64 107 C54 97 30 70 30 34 Z"
        fill="url(#shieldGrad)"
        fill-opacity="0.9"
        stroke="#60A5FA"
        stroke-width="1.5"
        stroke-linejoin="round" />

  <!-- Firewall Barrier Core (L3/L4/L7 Gate) -->
  <path d="M64 34 L84 44 C84 68 68 85 64 91 C60 85 44 68 44 44 Z"
        fill="url(#firewallGrad)"
        stroke="#FCA5A5"
        stroke-width="1.5"
        stroke-linejoin="round" />

  <!-- Central Network Node Core (Stateful Inspection Hub) -->
  <circle cx="64" cy="58" r="7" fill="#FFFFFF" />
  <circle cx="64" cy="58" r="4" fill="#2563EB" />

  <!-- Network Circuit Trajectory Lines -->
  <path d="M64 65 L64 78" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="64" cy="78" r="2.5" fill="#FFFFFF" />

  <path d="M57 55 L48 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" />
  <circle cx="47" cy="47" r="2" fill="#93C5FD" />

  <path d="M71 55 L80 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" />
  <circle cx="81" cy="47" r="2" fill="#93C5FD" />
</svg>
